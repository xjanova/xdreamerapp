name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length=100 lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
