name: Release · Android APK

# The app is sideloaded, not shipped through Play Store: this workflow *is* the
# distribution channel. `GET /api/mobile/app-version` on ai.xman4289.com reads
# the release this publishes, and the app updates itself from it — so the asset
# names and the SHA256SUMS.txt file are a contract, not a convenience.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach the build to a GitHub Release?'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.7'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VER_NAME="${TAG_NAME#v}"
          else
            VER_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG_NAME="v${VER_NAME}"
          fi
          echo "version=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Signing must be stable across releases: Android refuses to install an
      # update signed with a different key than the installed app, which would
      # brick self-update for everyone who already has it. Without the secrets
      # the build falls back to the debug key — fine for a smoke test, never for
      # a release anybody installs.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::No signing secrets — building with the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # Paths in key.properties resolve relative to android/app/.
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      # One APK for both ARM ABIs, so the updater never has to work out which
      # slice a phone needs.
      #
      # `--target-platform` and not `ndk.abiFilters`: the Flutter Gradle plugin
      # packages the engine itself and ignores the filter — with the filter set
      # to the two ARM ABIs the APK still contained 19MB of lib/x86_64, which is
      # only ever used by emulators running debug builds. Dropping it takes the
      # release from 58MB to ~39MB, which matters for an app that pulls its own
      # updates over mobile data.
      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64,android-arm \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ steps.ver.outputs.build }} \
            --obfuscate --split-debug-info=build/symbols

      - name: Stage artifacts
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          STAGE=build/release
          mkdir -p "$STAGE"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$STAGE/xdreamer-${{ steps.ver.outputs.version }}.apk"
          # The app reads this file through the API and refuses to install an
          # APK whose digest does not match.
          (cd "$STAGE" && sha256sum *.apk > SHA256SUMS.txt)
          ls -la "$STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.stage.outputs.stage }}/*.apk
            ${{ steps.stage.outputs.stage }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ steps.ver.outputs.version }}
          path: build/symbols
          retention-days: 90

      - name: Extract release notes
        if: ${{ github.ref_type == 'tag' || inputs.publish_release == true }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p build
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$V" '
              /^## / { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found = 1; next } }
              found { print }
            ' CHANGELOG.md > build/release-notes.md || true
          fi
          [[ -s build/release-notes.md ]] || echo "_X-DREAMER ${V}_" > build/release-notes.md

      # The release body becomes the changelog the in-app update sheet shows,
      # so write it for customers, not for us.
      - name: Publish release
        if: ${{ github.ref_type == 'tag' || inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: X-DREAMER ${{ steps.ver.outputs.version }}
          body_path: build/release-notes.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            ${{ steps.stage.outputs.stage }}/*.apk
            ${{ steps.stage.outputs.stage }}/SHA256SUMS.txt
